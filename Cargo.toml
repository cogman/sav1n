[package]
name = "sav1n"
version = "0.1.0"
authors = ["cogma"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
mimalloc = "0.1.52"
tokio = { version = "1.54", features=["io-std", "fs", "io-util", "time", "process", "macros", "rt-multi-thread", "sync", "signal"] }
clap = "4.6"
regex = "1.13"
serde_json = "1.0.154"
glob = "0.3.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
